name: Publish to npm

on:
  # Manual: Actions tab -> "Publish to npm" -> Run workflow
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: patch | minor | major | none"
        default: patch
        required: false
  # Automatic: pushing a tag like v0.1.1 publishes that version
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted Publishing (OIDC) requires npm >= 11.5
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$INPUT_BUMP" -m "chore: release %s"
          git push
          git push origin --tags
        env:
          INPUT_BUMP: ${{ inputs.bump }}

      # Authenticates via GitHub OIDC. The package's Trusted Publisher on
      # npmjs.com must list this repo + this workflow filename (publish.yml).
      - name: Publish
        run: npm publish --access public --provenance

      - name: Published version
        run: npm view "$(node -p "require('./package.json').name")" version

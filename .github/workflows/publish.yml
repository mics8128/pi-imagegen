name: Publish to npm

on:
  # Manual release: Actions tab -> "Release" -> choose a version bump.
  # GitHub does not trigger a second workflow from a tag pushed with GITHUB_TOKEN,
  # so this release job publishes directly after it pushes the version tag.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
  # A tag pushed by a user or another trusted tool publishes through the tag job.
  # Tags created by this workflow are already published by the release job above.
  push:
    tags:
      - "v*"

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test

      - name: Bump, commit, and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "$INPUT_BUMP" -m "chore: release %s"
          git push origin main --follow-tags
        env:
          INPUT_BUMP: ${{ inputs.bump }}

      # The tag above was pushed with GITHUB_TOKEN, which intentionally cannot
      # trigger the tag workflow. Publish this manual release in the same OIDC job.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish --access public --provenance

      - name: Published version
        run: npm view "$(node -p "require('./package.json').name")" version

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC). No NPM_TOKEN secret needed.
      id-token: write
    concurrency:
      group: npm-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          npm install --ignore-scripts
          npm test

      # Trusted Publishing (OIDC) requires npm >= 11.5.
      - name: Ensure recent npm
        run: npm install -g npm@latest

      # Authenticates through GitHub OIDC. Configure the npm package's Trusted
      # Publisher for mics8128/pi-imagegen and this file: publish.yml.
      - name: Publish
        run: npm publish --access public --provenance

      - name: Published version
        run: npm view "$(node -p "require('./package.json').name")" version
